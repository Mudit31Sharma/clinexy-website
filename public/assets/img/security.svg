<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Security and compliance">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF4FF"/><stop offset="1" stop-color="#E3EDFF"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E7BF0"/><stop offset="1" stop-color="#1B4FB0"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34C883"/><stop offset="1" stop-color="#1E9C63"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6AE1" stop-opacity="0.28"/><stop offset="1" stop-color="#1F6AE1" stop-opacity="0"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1F3A6B" flood-opacity="0.16"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3A6B" flood-opacity="0.18"/></filter>
</defs>
<style>
text{font-family:Inter,Segoe UI,system-ui,sans-serif}
.flt{animation:flt 5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.flt2{animation:flt 6s ease-in-out infinite;animation-delay:-2s}
.pulse{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.fadeup{opacity:0;animation:fu .8s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 2.6s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.grow{transform:scaleY(0);transform-origin:bottom;animation:gr 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes gr{to{transform:scaleY(1)}}
.spin{transform-origin:center;animation:sp 1.4s ease forwards}
@keyframes sp{0%{opacity:0;transform:scale(.4) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.ring{stroke-dasharray:540;stroke-dashoffset:540;animation:dr 1.8s ease forwards}
.blink{animation:bl 1.3s steps(1) infinite}
@keyframes bl{50%{opacity:.25}}
.sweep{animation:sw 3.2s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-160px);opacity:0}30%{opacity:.5}60%{opacity:0}100%{transform:translateX(420px);opacity:0}}
.rise{animation:ri 3s ease-in-out infinite}
@keyframes ri{0%{opacity:0;transform:translateY(16px) scale(.9)}40%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.1)}}
</style><rect width="600" height="450" fill="url(#bg)"/>
<g class="flt2"><rect x="80" y="54" width="440" height="342" rx="20" fill="#fff" filter="url(#sh)"/></g>
<path d="M300 92 l86 30 v66 c0 60 -44 94 -86 112 c-42 -18 -86 -52 -86 -112 v-66 z" fill="none" stroke="#1F6AE1" stroke-width="5" class="ring"/>
<path d="M300 104 l72 26 v58 c0 50 -38 80 -72 96 c-34 -16 -72 -46 -72 -96 v-58 z" fill="url(#blue)" opacity=".12"/>
<path d="M266 188 l24 24 l46 -52" fill="none" stroke="#2BB673" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:.6s"/>
<g class="fadeup" style="animation-delay:.8s;transform:translateY(10px)"><rect x="120" y="320" width="110" height="40" rx="20" fill="#EAF1FF"/><text x="175" y="345" font-size="12" font-weight="700" fill="#1F6AE1" text-anchor="middle">HIPAA</text></g>
<g class="fadeup" style="animation-delay:.95s;transform:translateY(10px)"><rect x="246" y="320" width="110" height="40" rx="20" fill="#E8F7EF"/><text x="301" y="345" font-size="12" font-weight="700" fill="#1E9C63" text-anchor="middle">GDPR</text></g>
<g class="fadeup" style="animation-delay:1.1s;transform:translateY(10px)"><rect x="372" y="320" width="110" height="40" rx="20" fill="#FFF4E5"/><text x="427" y="345" font-size="12" font-weight="700" fill="#B26B00" text-anchor="middle">DPDP</text></g>
<g class="flt"><circle cx="430" cy="120" r="26" fill="url(#green)" filter="url(#sh2)"/><rect x="420" y="116" width="20" height="16" rx="3" fill="#fff"/><path d="M424 116 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#fff" stroke-width="3"/></g>
</svg>