<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Online booking calendar">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF4FF"/><stop offset="1" stop-color="#E3EDFF"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E7BF0"/><stop offset="1" stop-color="#1B4FB0"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34C883"/><stop offset="1" stop-color="#1E9C63"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6AE1" stop-opacity="0.28"/><stop offset="1" stop-color="#1F6AE1" stop-opacity="0"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1F3A6B" flood-opacity="0.16"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3A6B" flood-opacity="0.18"/></filter>
</defs>
<style>
text{font-family:Inter,Segoe UI,system-ui,sans-serif}
.flt{animation:flt 5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.flt2{animation:flt 6s ease-in-out infinite;animation-delay:-2s}
.pulse{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.fadeup{opacity:0;animation:fu .8s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 2.6s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.grow{transform:scaleY(0);transform-origin:bottom;animation:gr 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes gr{to{transform:scaleY(1)}}
.spin{transform-origin:center;animation:sp 1.4s ease forwards}
@keyframes sp{0%{opacity:0;transform:scale(.4) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.ring{stroke-dasharray:540;stroke-dashoffset:540;animation:dr 1.8s ease forwards}
.blink{animation:bl 1.3s steps(1) infinite}
@keyframes bl{50%{opacity:.25}}
.sweep{animation:sw 3.2s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-160px);opacity:0}30%{opacity:.5}60%{opacity:0}100%{transform:translateX(420px);opacity:0}}
.rise{animation:ri 3s ease-in-out infinite}
@keyframes ri{0%{opacity:0;transform:translateY(16px) scale(.9)}40%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.1)}}
</style><rect width="600" height="450" fill="url(#bg)"/>
<g class="flt2"><rect x="60" y="54" width="480" height="346" rx="22" fill="#fff" filter="url(#sh)"/></g>
<text x="88" y="104" font-size="18" font-weight="800" fill="#1F2937">This week</text>
<g class="flt"><rect x="372" y="84" width="144" height="32" rx="16" fill="#EAF1FF"/><text x="444" y="105" font-size="13" font-weight="700" fill="#1F6AE1" text-anchor="middle">86% booked</text></g>
<g class="fadeup" style="animation-delay:0.10s;transform:translateY(10px)"><rect x="88" y="150" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="102" y="178" font-size="13" font-weight="600" fill="#1F2937">09:00</text><path d="M186 172 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.18s;transform:translateY(10px)"><rect x="236" y="150" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="250" y="178" font-size="13" font-weight="600" fill="#1F2937">09:30</text><path d="M334 172 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.26s;transform:translateY(10px)"><rect x="384" y="150" width="132" height="46" rx="10" fill="#F1F5FB" stroke="#E5E9F0" stroke-width="1.5"/><text x="398" y="178" font-size="13" font-weight="600" fill="#1F2937">10:00</text></g><g class="fadeup" style="animation-delay:0.34s;transform:translateY(10px)"><rect x="88" y="208" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="102" y="236" font-size="13" font-weight="600" fill="#1F2937">10:30</text><path d="M186 230 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.42s;transform:translateY(10px)"><rect x="236" y="208" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="250" y="236" font-size="13" font-weight="600" fill="#1F2937">11:00</text><path d="M334 230 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.50s;transform:translateY(10px)"><rect x="384" y="208" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="398" y="236" font-size="13" font-weight="600" fill="#1F2937">11:30</text><path d="M482 230 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.58s;transform:translateY(10px)"><rect x="88" y="266" width="132" height="46" rx="10" fill="#F1F5FB" stroke="#E5E9F0" stroke-width="1.5"/><text x="102" y="294" font-size="13" font-weight="600" fill="#1F2937">12:00</text></g><g class="fadeup" style="animation-delay:0.66s;transform:translateY(10px)"><rect x="236" y="266" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="250" y="294" font-size="13" font-weight="600" fill="#1F2937">14:00</text><path d="M334 288 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.74s;transform:translateY(10px)"><rect x="384" y="266" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="398" y="294" font-size="13" font-weight="600" fill="#1F2937">14:30</text><path d="M482 288 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.82s;transform:translateY(10px)"><rect x="88" y="324" width="132" height="46" rx="10" fill="#F1F5FB" stroke="#E5E9F0" stroke-width="1.5"/><text x="102" y="352" font-size="13" font-weight="600" fill="#1F2937">15:00</text></g><g class="fadeup" style="animation-delay:0.90s;transform:translateY(10px)"><rect x="236" y="324" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="250" y="352" font-size="13" font-weight="600" fill="#1F2937">15:30</text><path d="M334 346 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fadeup" style="animation-delay:0.98s;transform:translateY(10px)"><rect x="384" y="324" width="132" height="46" rx="10" fill="#E8F7EF" stroke="#2BB673" stroke-width="1.5"/><text x="398" y="352" font-size="13" font-weight="600" fill="#1F2937">16:00</text><path d="M482 346 l5 5 l9 -10" fill="none" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="flt"><rect x="350" y="356" width="180" height="40" rx="12" fill="url(#green)" filter="url(#sh2)"/><path d="M372 376 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="404" y="381" font-size="13" font-weight="800" fill="#fff">New booking</text></g>
</svg>