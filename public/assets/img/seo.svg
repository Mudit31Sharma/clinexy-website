<g class="fadeup" style="animation-delay:.2s;transform:translateY(12px)"><rect x="90" y="146" width="420" height="64" rx="12" fill="#EAF1FF" stroke="#1F6AE1" stroke-width="2"/>
<rect x="104" y="160" width="34" height="34" rx="8" fill="url(#blue)"/><text x="121" y="183" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="150" y="172" font-size="14" font-weight="800" fill="#1F2937">Your Practice</text><text x="150" y="192" font-size="12" fill="#1E9C63">★★★★★ 4.9 (212) · Open now</text>
<g class="flt"><rect x="430" y="158" width="66" height="24" rx="12" fill="url(#green)"/><text x="463" y="175" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">#1 ▲</text></g></g>
<g class="fadeup" style="animation-delay:.45s;transform:translateY(12px)"><rect x="90" y="222" width="420" height="48" rx="10" fill="#F8FAFF" stroke="#E5E9F0"/><rect x="104" y="234" width="24" height="24" rx="6" fill="#CBD8EC"/><text x="140" y="250" font-size="13" fill="#64748B">Competitor clinic</text></g>
<g class="fadeup" style="animation-delay:.6s;transform:translateY(12px)"><rect x="90" y="282" width="420" height="48" rx="10" fill="#F8FAFF" stroke="#E5E9F0"/><rect x="104" y="294" width="24" height="24" rx="6" fill="#CBD8EC"/><text x="140" y="310" font-size="13" fill="#64748B">Another clinic</text></g>
